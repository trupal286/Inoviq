<!DOCTYPE html>
<html lang="en" ng-app="digiCardApp">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inoviq — Digital business cards and personal catalog.">
  <title>Inoviq — Digital Visiting Card Platform</title>

  <!-- Typography: Instrument Serif, Fraunces, Manrope, Work Sans, Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Core Stylesheets + Isolated Auth Gate Modal Styles -->
  <link rel="stylesheet" href="Style/style.css?v=5.0">
  <link rel="stylesheet" href="Style/auth-modal.css?v=1.0">

  <!-- Apply saved theme before paint -->
  <script>
    (function () {
      var t = localStorage.getItem('inoviq_theme') || 'light';
      if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <!-- AngularJS 1.8.x & UI-Router CDN -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular-ui-router/1.0.30/angular-ui-router.min.js"></script>
</head>

<body>

  <!-- Main Application UI-Router View Port -->
  <div ui-view></div>

  <!-- Reusable Auth Gate Popup Component Mounted ONCE in Main Shell -->
  <auth-gate></auth-gate>

  <!-- Application Services & Modules -->
  <script src="services/auth.service.js"></script>
  <script src="services/auth-modal.service.js"></script>
  <script src="components/auth-gate.component.js"></script>
  <script src="routes.config.js"></script>
  <script src="app.js"></script>

</body>
</html>
